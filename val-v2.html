<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Val — Asistente de Voz de AplicatiBox</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:'Segoe UI', system-ui, sans-serif;
    background:#0a0c0e; color:#eef7f2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(30,38,43,.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,38,43,.4) 1px, transparent 1px);
    background-size:24px 24px; opacity:.5;
  }
  body::after {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 40% at 50% 40%, rgba(16,185,129,.13), transparent 60%);
  }
  .wrap { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%; max-width:420px; padding:0 20px; }
  #orb {
    width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #16211b 0%, #0d1210 45%, #070a08 100%);
    border:1px solid rgba(78,222,163,.4);
    box-shadow:0 0 32px -8px rgba(16,185,129,.35), inset 0 0 40px rgba(0,0,0,.6);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease, border-color .4s ease;
    position:relative; margin-bottom:28px;
  }
  #orb:active { transform:scale(.93); }
  #orb svg { width:52px; height:52px; color:#4edea3; filter:drop-shadow(0 0 10px rgba(16,185,129,.55)); transition:color .3s; }
  #orb::before, #orb::after {
    content:''; position:absolute; inset:-10px; border-radius:50%;
    border:2px solid transparent; opacity:0; pointer-events:none;
  }
  #orb.idle::before { animation:ringBreath 3s ease-in-out infinite; border-color:rgba(78,222,163,.18); }
  #orb.listening::before { animation:ringWave 1.6s ease-out infinite; border-color:rgba(16,185,129,.55); }
  #orb.listening::after  { animation:ringWave 1.6s ease-out infinite .8s; border-color:rgba(16,185,129,.35); }
  #orb.thinking::before { animation:ringSpin 1.2s linear infinite; border-color:rgba(245,158,11,.65); border-top-color:transparent; border-right-color:transparent; }
  #orb.speaking::before { animation:ringBeat .8s ease-in-out infinite; border-color:rgba(56,189,248,.5); }
  #orb.idle      { animation:breath 3.2s ease-in-out infinite; border-color:rgba(78,222,163,.35); }
  #orb.listening { animation:pulse 1.1s ease-in-out infinite; border-color:#10B981; box-shadow:0 0 44px -4px rgba(16,185,129,.6); }
  #orb.thinking  { animation:spin 1.6s linear infinite; border-color:#F59E0B; box-shadow:0 0 44px -6px rgba(245,158,11,.5); }
  #orb.speaking  { animation:speakA .9s ease-in-out infinite; border-color:#38BDF8; box-shadow:0 0 56px -4px rgba(56,189,248,.65); }
  @keyframes breath { 0%,100%{transform:scale(1);box-shadow:0 0 24px -8px rgba(78,222,163,.25)} 50%{transform:scale(1.02);box-shadow:0 0 34px -6px rgba(78,222,163,.4)} }
  @keyframes pulse  { 0%,100%{transform:scale(1);box-shadow:0 0 28px 2px rgba(16,185,129,.45)} 50%{transform:scale(1.05);box-shadow:0 0 48px -2px rgba(16,185,129,.75)} }
  @keyframes spin   { 0%{filter:hue-rotate(0) saturate(1.1)} 100%{filter:hue-rotate(360deg) saturate(1.1)} }
  @keyframes speakA { 0%,100%{transform:scale(1);box-shadow:0 0 36px -6px rgba(56,189,248,.5)} 50%{transform:scale(1.04);box-shadow:0 0 60px -4px rgba(56,189,248,.8)} }
  @keyframes ringBreath { 0%,100%{transform:scale(1);opacity:.25} 50%{transform:scale(1.06);opacity:.5} }
  @keyframes ringWave { 0%{transform:scale(.95);opacity:.8} 100%{transform:scale(1.45);opacity:0} }
  @keyframes ringSpin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  @keyframes ringBeat { 0%,100%{transform:scale(1);opacity:.4} 50%{transform:scale(1.1);opacity:.8} }
  #estado { font-size:13px; color:#94a3b8; letter-spacing:.02em; text-align:center; margin-bottom:8px; min-height:18px; }
  #titulo { font-size:20px; font-weight:300; color:#eef7f2; letter-spacing:-.01em; text-align:center; margin-bottom:32px; }
  #chat {
    width:100%; max-height:38vh; overflow-y:auto; margin-bottom:16px;
    display:flex; flex-direction:column; gap:8px; padding:4px;
  }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.45; }
  .msg.user { align-self:flex-end; background:rgba(16,185,129,.15); border:1px solid rgba(16,185,129,.35); }
  .msg.bot  { align-self:flex-start; background:rgba(17,20,24,.9); border:1px solid rgba(30,38,43,.8); }
  #chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:16px; }
  .chip {
    background:rgba(17,20,24,.85); border:1px solid rgba(78,222,163,.35); color:#e2e2e5;
    border-radius:9999px; padding:9px 16px; font-size:12px; cursor:pointer;
    backdrop-filter:blur(10px); transition:all .2s;
  }
  .chip:active { background:rgba(16,185,129,.2); border-color:#10B981; transform:scale(.97); }
  #input {
    width:100%; background:rgba(17,20,24,.92); border:1px solid rgba(78,222,163,.35);
    border-radius:9999px; padding:13px 20px; color:#eef7f2; font-size:15px; outline:none;
    backdrop-filter:blur(12px);
  }
  #input:focus { border-color:#10B981; box-shadow:0 0 0 3px rgba(16,185,129,.15); }
  #dbg { position:fixed; top:6px; right:8px; z-index:999; font-size:10px; color:#64748b; font-family:monospace; background:rgba(10,12,14,.7); padding:3px 8px; border-radius:8px; pointer-events:none; opacity:.85; }
</style>
</head>
<body>
<div id="dbg">v2.0 listo</div>
<div class="wrap">
  <div id="orb" class="idle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
      <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
      <path d="M12 18v3"/>
    </svg>
  </div>
  <div id="titulo">Val — Asistente de Voz</div>
  <div id="estado">Toca el círculo para empezar</div>
  <div id="chat"></div>
  <div id="chips">
    <button class="chip" data-q="qué puede hacer Val por mi empresa">¿Qué puede hacer Val?</button>
    <button class="chip" data-q="cuánto cuesta el asistente">Planes y precios</button>
    <button class="chip" data-q="cómo instalo Val en mi negocio">Cómo la instalo</button>
    <button class="chip" data-q="quiero ver el catálogo de ejemplo">Ver demo de catálogo</button>
  </div>
  <input id="input" placeholder="También puedes escribirme aquí… (Enter para enviar)">
</div>
<script>
/* ============ VAL v2.0 — MediaRecorder+VAD → Cloudflare Worker (PRD v2) ============ */
const WORKER = 'https://val-asr-tts.aplicatibox.workers.dev';
const orb = document.getElementById('orb'), estadoEl = document.getElementById('estado');
const chat = document.getElementById('chat'), input = document.getElementById('input'), dbg = document.getElementById('dbg');
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fmt = n => '$' + Number(n).toLocaleString('es-CO');

const CATALOGO = [
  { nombre:'Limpieza Facial Clásica', precio:120000, dur:60, desc:'Limpieza profunda con extracción y máscara hidratante' },
  { nombre:'Limpieza Facial Deluxe', precio:180000, dur:75, desc:'Peeling suave, alta frecuencia y máscara de vitamina C' },
  { nombre:'Dermapen + Activos', precio:320000, dur:60, desc:'Microneedling con ácido hialurónico' },
  { nombre:'Láser Dplex', precio:280000, dur:45, desc:'Manchas y pigmentación' },
  { nombre:'Botox Tercio Superior', precio:450000, dur:30, desc:'Líneas de expresión frente y patas de gallo' },
  { nombre:'Relleno de Labios', precio:580000, dur:45, desc:'Ácido hialurónico con control a los 15 días' },
  { nombre:'Masaje Relajante', precio:140000, dur:60, desc:'Aromaterapia y maniobras suaves' },
];
const PLANES = 'Starter 99 dólares al mes (conversaciones ilimitadas web, 30 servicios), Pro 199 dólares (más WhatsApp, recordatorios y analítica), y Premium 349 dólares (más llamadas, multi-sede y soporte prioritario).';
const RX = {
  saludar: /^(hola|buenas|buenos dias|buenas tardes|buenas noches|hey|que mas|que tal)/,
  agendar: /(agendar|agendo|cita|reservar|reserva|apartar|disponibilidad|horario|turno)/,
  precio: /(precio|precios|cuanto|valor|tarifa|cuesta)/,
  servicios: /(servicios|tratamientos|catalogo|opciones|que tienen|que hacen|demo)/,
  planes: /(planes|suscripcion|mensualidad|contratar|cuesta el (asistente|val)|cuanto cuesta el)/,
  instalar: /(como (instalo|obtengo|consigo)|instalar|instalacion|gratis|open source|github|me interesa)/,
  quehace: /(que puede hacer|que haces|como funciona|para que sirves|capacidades|como me ayudas)/,
  whatsapp: /(whatsapp|contacto|hablar con alguien|asesor|humano)/,
  derivar: /(reclamo|queja|demanda|urgencia|me duele|emergencia)/,
};
function buscarServicio(t) {
  let mejor = null, mejorLen = 0;
  for (const s of CATALOGO) {
    const n = norm(s.nombre);
    if (n.length > 2 && t.includes(n) && n.length > mejorLen) { mejor = s; mejorLen = n.length; }
    for (const w of n.split(' ')) if (w.length > 4 && t.includes(w) && w.length > mejorLen) { mejor = s; mejorLen = w.length; }
  }
  return mejor;
}
function pensar(texto) {
  const t = norm(texto);
  if (!t || t.length < 2) return null;
  if (RX.saludar.test(t)) return '¡Hola! Soy Val, la asistente de voz de AplicatiBox. Conmigo tu empresa responde a sus clientes por voz a toda hora. Pregúntame qué puedo hacer, los planes, o pide el catálogo de ejemplo.';
  if (RX.derivar.test(t)) { window.open('https://wa.me/573001234567?text=' + encodeURIComponent('Hola, vengo de la página de Val y quiero hablar con un asesor.'), '_blank'); return 'Te paso directo con un asesor humano por WhatsApp. Enseguida te atienden.'; }
  if (RX.quehace.test(t)) return 'Conmigo tu empresa atiende por voz las 24 horas: respondo preguntas de tus clientes, doy precios e información de tus servicios, agendo citas y las paso a tu WhatsApp. No descansa y atiende a varios a la vez. ¿Quieres ver el catálogo de ejemplo o prefieres que un asesor te contacte?';
  if (RX.planes.test(t)) return 'Con gusto. Val tiene tres planes: ' + PLANES + ' El Starter es el más popular para empezar. ¿Quieres que un asesor te contacte para activarla en tu negocio?';
  if (RX.instalar.test(t)) return 'Te cuento: Val es un proyecto abierto y gratuito — el código está disponible para todos. Si la quieres funcionando en tu negocio con tus servicios, precios y horario, la instalación la hace nuestro equipo de AplicatiBox. ¿Te pongo con un asesor?';
  if (RX.agendar.test(t)) return '¡Claro que te agendo! Para la demo usa este catálogo de ejemplo. Dime tu nombre y el servicio que te interesa, y te paso la confirmación por WhatsApp.';
  const s = buscarServicio(t);
  if (s && RX.precio.test(t)) return 'En este catálogo de ejemplo, ' + s.nombre + ' son ' + fmt(s.precio) + ' y dura ' + s.dur + ' minutos. Así es como yo le daría la información de TU empresa a tus clientes. ¿Otra cosa?';
  if (s) return s.nombre + ': ' + s.desc + '. Son ' + fmt(s.precio) + ' por ' + s.dur + ' minutos. ¿Quieres ver más del catálogo o te explico los planes?';
  if (RX.servicios.test(t)) { mostrarCatalogo(); return 'Este es el catálogo de ejemplo con el que estoy demostrando. Con tu empresa usaría TUS servicios, precios y horarios. ¿Te cuento los planes o pides un servicio concreto?'; }
  if (RX.whatsapp.test(t)) { window.open('https://wa.me/573001234567?text=' + encodeURIComponent('Hola, vengo de la página de Val y quiero información.'), '_blank'); return 'Listo, te abrí el WhatsApp de AplicatiBox. Un asesor te atiende enseguida.'; }
  if (RX.precio.test(t)) return 'Con gusto. ¿Buscas el precio de algún servicio del catálogo de ejemplo, o el precio de los planes de Val? Toca el chip que te interese.';
  return 'Cuéntame un poquito más: ¿quieres saber qué puedo hacer por tu empresa, ver los planes, el catálogo de ejemplo, o que te ponga con un asesor?';
}
function mostrarCatalogo() {
  let html = '';
  CATALOGO.forEach(s => { html += '<div class="msg bot" style="display:flex;justify-content:space-between;gap:10px;"><span>' + s.nombre + '<br><small style="color:#94a3b8">' + s.dur + ' min</small></span><b style="color:#4edea3">' + fmt(s.precio) + '</b></div>'; });
  chat.insertAdjacentHTML('beforeend', html);
  chat.scrollTop = chat.scrollHeight;
}
/* ---------- UI helpers ---------- */
let presentada = false, busy = false, recording = false;
let stream = null, mediaRecorder = null, chunks = [], audioCtx = null, startedAt = 0, silenceAt = 0;
let valAudio = null, micBlocked = false, listenFails = 0;
function setDbg(t, c) { dbg.textContent = t; dbg.style.color = c || '#64748b'; }
function modo(m) {
  orb.className = m;
  const svg = orb.querySelector('svg');
  const colores = { idle:'#4edea3', listening:'#10B981', thinking:'#F59E0B', speaking:'#38BDF8' };
  if (svg) svg.style.color = colores[m] || colores.idle;
  const textos = {
    idle: presentada ? 'Escuchándote — pregúntame lo que quieras' : 'Toca el círculo para empezar',
    listening: 'Te escucho… habla normal',
    thinking: 'Pensando…',
    speaking: 'Val hablando… toca el círculo para interrumpir',
  };
  estadoEl.textContent = textos[m];
}
function addMsg(texto, quien) {
  const d = document.createElement('div');
  d.className = 'msg ' + quien; d.textContent = texto;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
/* ---------- TTS: MP3 del Worker (sin speechSynthesis — PRD §4) ---------- */
let valSpeaking = false;
let ttsAbort = null;
function interrumpir() {
  valSpeaking = false;
  if (ttsAbort) { try { ttsAbort.abort(); } catch(_){} ttsAbort = null; }
  if (valAudio) { try { valAudio.pause(); } catch(_){} valAudio = null; }
}
async function hablar(texto) {
  valSpeaking = true;
  ttsAbort = new AbortController();
  addMsg(texto, 'bot');
  modo('speaking');
  try {
    const res = await fetch(WORKER + '/api/tts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text: texto }), signal: ttsAbort.signal });
    if (!res.ok) throw new Error('tts ' + res.status);
    const blob = await res.blob();
    if (!blob.size) throw new Error('tts vacío');
    valAudio = new Audio(URL.createObjectURL(blob));
    await new Promise(r => {
      valAudio.onended = r;
      valAudio.onerror = r;
      valAudio.onpause = r; // se resuelve al pausar (interrumpir)
      valAudio.play().catch(r);
    });
  } catch (e) {
    if (e.name !== 'AbortError') { /* anti-eco: sin TTS, solo texto en chat */ }
  }
  valAudio = null;
  ttsAbort = null;
  valSpeaking = false;
  modo('idle');
}
/* ---------- CEREBRO: texto → respuesta (local, sin LLM) ---------- */
async function responder(texto) {
  if (busy) return;
  busy = true;
  addMsg(texto, 'user');
  modo('thinking');
  const r = pensar(texto);
  if (!r) { busy = false; modo('idle'); scheduleNextListen(400); return; }
  await hablar(r);
  busy = false;
  scheduleNextListen(600); // PRD §5: reanudar + ventana ciega 800ms
}
/* ---------- ASR: blob → Worker → texto ---------- */
async function transcribe(blob) {
  modo('thinking');
  try {
    const fd = new FormData();
    fd.append('file', blob, 'audio.webm');
    const res = await fetch(WORKER + '/api/asr', { method: 'POST', body: fd });
    const j = await res.json();
    if (j.text && j.text.trim()) { busy = false; responder(j.text.trim()); return; }
    setDbg('asr vacío', '#F59E0B');
  } catch (e) { setDbg('asr err: ' + e.message, '#F59E0B'); }
  modo('idle');
  scheduleNextListen(400);
}
/* ---------- PIPELINE ESTABLE: getUserMedia + MediaRecorder + VAD 1.3s (valeria 219cc80) ---------- */
async function listen() {
  if (busy || recording || !presentada || micBlocked || valSpeaking) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    listenFails = 0;
  } catch (e) {
    listenFails++;
    if (listenFails === 1) {
      addMsg('🎙 Activa el micrófono: candado 🔒 de la barra → Permisos → Micrófono → Permitir. Mientras tanto, escríbeme abajo — contesto igual.', 'bot');
      micBlocked = true; modo('idle'); input.focus();
    }
    return;
  }
  try { chunks = []; mediaRecorder = new MediaRecorder(stream); }
  catch (e) { scheduleNextListen(1500); return; }
  mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    try { stream.getTracks().forEach(t => t.stop()); } catch(_) {}
    if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; }
    const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    if (blob.size < 1300) { modo('idle'); scheduleNextListen(400); return; } // toque accidental
    transcribe(blob);
  };
  try { mediaRecorder.start(); } catch (e) { scheduleNextListen(1200); return; }
  recording = true; startedAt = Date.now();
  modo('listening');
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
  src.connect(analyser);
  const buf = new Uint8Array(analyser.frequencyBinCount);
  let spoke = false; silenceAt = 0;
  const vad = setInterval(() => {
    if (!recording) { clearInterval(vad); return; }
    analyser.getByteFrequencyData(buf);
    const level = buf.reduce((a,b) => a+b, 0) / buf.length;
    const now = Date.now();
    if (level > 14) { spoke = true; silenceAt = 0; }
    else if (spoke && !silenceAt) silenceAt = now;
    const maxMs = 16000;
    if ((spoke && silenceAt && now - silenceAt > 1300) || now - startedAt > maxMs) {
      clearInterval(vad);
      recording = false;
      try { mediaRecorder.stop(); } catch(_) {}
    }
  }, 120);
}
function scheduleNextListen(ms) {
  setTimeout(() => { if (presentada && !busy && !recording && !micBlocked) listen(); }, ms || 600);
}
/* ---------- ARRANQUE / EVENTOS ---------- */
async function empezar() {
  if (presentada) { listen(); return; }
  presentada = true;
  document.getElementById('titulo').textContent = 'Val — Asistente de Voz de AplicatiBox';
  await hablar('¡Hola! Soy Val, la asistente de voz de AplicatiBox. Conmigo, tu empresa responde a sus clientes por voz a toda hora: información, precios y reservas. Toca el círculo y háblame.');
  listen();
}
orb.addEventListener('click', () => {
  if (valSpeaking) { interrumpir(); modo('listening'); listen(); return; } // barge-in táctil en CUALQUIER fase del TTS
  if (!presentada) empezar(); else listen();
});
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  interrumpir();
  if (!presentada) { presentada = true; document.getElementById('titulo').textContent = 'Val — Asistente de Voz de AplicatiBox'; }
  responder(c.dataset.q);
}));
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && input.value.trim()) {
    const v = input.value.trim(); input.value = '';
    interrumpir();
    if (!presentada) { presentada = true; document.getElementById('titulo').textContent = 'Val — Asistente de Voz de AplicatiBox'; }
    responder(v);
  }
});
modo('idle');
console.log('[Val v2.0] MediaRecorder+VAD 1.3s → Worker (asr Groq / tts MP3). Sin SpeechRecognition.');


</script>
</body>
</html>

<style>
    /* Obsidian Micro-grid background */
    .bg-micro-grid {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(30, 38, 43, 0.45) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(30, 38, 43, 0.45) 1px, transparent 1px);
    }

    /* Ambient dynamic auroras */
    .aurora-bg {
      background: radial-gradient(circle at 50% 45%, rgba(16, 185, 129, 0.08) 0%, rgba(18, 20, 22, 0) 70%),
                  radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.4) 0%, rgba(18, 20, 22, 0.95) 100%);
    }

    /* Orb Keyframes */
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.85; filter: blur(0px); }
      50% { transform: scale(1.06); opacity: 1; filter: blur(1px); }
    }

    @keyframes rotate-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes ripple-ring {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.85); opacity: 0; }
    }

    @keyframes equalize {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }

    .animate-pulse-slow {
      animation: pulse-slow 4s ease-in-out infinite;
    }

    .animate-spin-slow {
      animation: rotate-slow 16s linear infinite;
    }

    .animate-spin-reverse {
      animation: rotate-slow 12s linear infinite reverse;
    }

    .animate-ripple {
      animation: ripple-ring 2.4s cubic-bezier(0.1, 0.4, 0.2, 1) infinite;
    }

    /* Soundwave equalizer bars */
    .eq-bar {
      animation: equalize 1.2s ease-in-out infinite;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.15s; }
    .eq-bar:nth-child(3) { animation-delay: 0.3s; }
    .eq-bar:nth-child(4) { animation-delay: 0.45s; }
    .eq-bar:nth-child(5) { animation-delay: 0.2s; }
    .eq-bar:nth-child(6) { animation-delay: 0.35s; }
    .eq-bar:nth-child(7) { animation-delay: 0.1s; }

    /* Custom Glass Panel */
    .glass-sheet {
      background: rgba(18, 20, 22, 0.88);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(60, 74, 66, 0.35);
    }
  </style>

<!-- INTERACTION LOGIC & VOICE ENGINE CONTROLLER -->
<script>
    let currentState = 'idle';
    const states = ['idle', 'listening', 'thinking', 'speaking'];
    let isSheetCollapsed = false;

    // Orb & UI DOM references
    const orbCore = document.getElementById('orb-core');
    const orbHalo = document.getElementById('orb-halo');
    const orbLayerOuter = document.getElementById('orb-layer-outer');
    const orbLayerMid = document.getElementById('orb-layer-mid');
    const orbEqualizer = document.getElementById('orb-equalizer');
    const orbThinkingIcon = document.getElementById('orb-thinking-icon');
    const orbMicIcon = document.getElementById('orb-mic-icon');
    const orbIdleIcon = document.getElementById('orb-idle-icon');
    const orbRipple1 = document.getElementById('orb-ripple-1');
    const orbRipple2 = document.getElementById('orb-ripple-2');

    const statusTitle = document.getElementById('status-title');
    const statusSubtitle = document.getElementById('status-subtitle');
    const fabIcon = document.getElementById('fab-icon');
    const fabGlow = document.getElementById('fab-glow');
    const mainFab = document.getElementById('main-fab');

    function resetOrbInternals() {
      orbEqualizer.classList.add('hidden');
      orbEqualizer.classList.remove('flex');
      orbThinkingIcon.classList.add('hidden');
      orbThinkingIcon.classList.remove('flex');
      orbMicIcon.classList.add('hidden');
      orbMicIcon.classList.remove('flex');
      orbIdleIcon.classList.add('hidden');
      orbIdleIcon.classList.remove('flex');

      orbRipple1.classList.remove('animate-ripple');
      orbRipple2.classList.remove('animate-ripple');
      orbRipple1.classList.add('opacity-0');
      orbRipple2.classList.add('opacity-0');

      // Reset state switcher tab pills
      states.forEach(st => {
        const btn = document.getElementById(`btn-state-${st}`);
        if(btn) {
          btn.className = "flex-1 py-1.5 text-center rounded-full text-label-sm font-label-sm transition-all duration-300 text-on-surface-variant hover:text-on-surface";
        }
      });
    }

    function setVoiceState(state) {
      currentState = state;
      resetOrbInternals();

      const activeBtn = document.getElementById(`btn-state-${state}`);
      if(activeBtn) {
        activeBtn.className = "flex-1 py-1.5 text-center rounded-full text-label-sm font-label-sm transition-all duration-300 bg-surface-container text-primary shadow-sm font-semibold";
      }

      if (state === 'idle') {
        // IDLE STATE
        statusTitle.textContent = "Val Concierge";
        statusSubtitle.textContent = "Toca el micrófono para hablar con Val";
        orbIdleIcon.classList.remove('hidden');
        orbIdleIcon.classList.add('flex');

        orbCore.className = "relative w-36 h-36 rounded-full flex items-center justify-center transition-all duration-700 shadow-2xl border border-primary/30 bg-gradient-to-b from-[#141d18] via-[#0d1210] to-[#070a08] overflow-hidden animate-pulse-slow";
        orbHalo.className = "absolute inset-0 rounded-full filter blur-2xl transition-all duration-700 bg-primary/20 opacity-30";
        orbLayerOuter.className = "absolute inset-4 rounded-full border border-outline-variant/40 animate-spin-slow transition-all duration-700";
        orbLayerMid.className = "absolute inset-8 rounded-full animate-spin-reverse opacity-50 filter blur-[1px] transition-all duration-700 bg-gradient-to-tr from-surface-container-high via-primary-container/20 to-secondary/20";

        fabIcon.textContent = "mic";
        fabIcon.className = "material-symbols-outlined text-primary text-3xl z-10 transition-transform group-hover:scale-110";
        mainFab.className = "relative group w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 focus:outline-none bg-[#111418] border border-primary/50 shadow-[0_0_24px_-4px_rgba(16,185,129,0.35)] active:scale-95";
        fabGlow.className = "absolute inset-0 rounded-full bg-primary/20 filter blur-md opacity-70 group-hover:opacity-100 transition-opacity";

      } else if (state === 'listening') {
        // LISTENING STATE
        statusTitle.textContent = "Te escucho...";
        statusSubtitle.textContent = "Habla con claridad, Val está analizando tu consulta clínica.";
        orbMicIcon.classList.remove('hidden');
        orbMicIcon.classList.add('flex');

        orbRipple1.classList.remove('opacity-0');
        orbRipple2.classList.remove('opacity-0');
        orbRipple1.classList.add('animate-ripple');
        orbRipple2.classList.add('animate-ripple');

        orbCore.className = "relative w-40 h-40 rounded-full flex items-center justify-center transition-all duration-700 shadow-2xl border-2 border-primary bg-gradient-to-b from-[#0f291e] via-[#091712] to-[#060c09] overflow-hidden scale-105";
        orbHalo.className = "absolute -inset-2 rounded-full filter blur-3xl transition-all duration-700 bg-primary/50 opacity-90";
        orbLayerOuter.className = "absolute inset-2 rounded-full border border-primary/60 animate-spin-slow transition-all duration-700";
        orbLayerMid.className = "absolute inset-6 rounded-full animate-spin-reverse opacity-90 filter blur-[2px] transition-all duration-700 bg-gradient-to-tr from-primary-container via-secondary to-primary";

        fabIcon.textContent = "stop";
        fabIcon.className = "material-symbols-outlined text-primary text-3xl z-10";
        mainFab.className = "relative group w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 focus:outline-none bg-[#162a20] border-2 border-primary shadow-[0_0_36px_2px_rgba(16,185,129,0.5)] active:scale-95";
        fabGlow.className = "absolute inset-0 rounded-full bg-primary/40 filter blur-md opacity-100";

      } else if (state === 'thinking') {
        // THINKING STATE
        statusTitle.textContent = "Consultando...";
        statusSubtitle.textContent = "Consultando disponibilidad médica y protocolos...";
        orbThinkingIcon.classList.remove('hidden');
        orbThinkingIcon.classList.add('flex');

        orbCore.className = "relative w-36 h-36 rounded-full flex items-center justify-center transition-all duration-700 shadow-2xl border border-amber-500/80 bg-gradient-to-b from-[#241808] via-[#170f05] to-[#0d0903] overflow-hidden";
        orbHalo.className = "absolute -inset-1 rounded-full filter blur-2xl transition-all duration-700 bg-amber-500/30 opacity-70";
        orbLayerOuter.className = "absolute inset-4 rounded-full border border-amber-400/40 animate-spin-slow transition-all duration-700";
        orbLayerMid.className = "absolute inset-7 rounded-full animate-spin-reverse opacity-70 filter blur-[2px] transition-all duration-700 bg-gradient-to-tr from-amber-600 via-amber-400/30 to-amber-200/20";

        fabIcon.textContent = "hourglass_top";
        fabIcon.className = "material-symbols-outlined text-amber-400 text-3xl z-10 animate-spin";
        mainFab.className = "relative group w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 focus:outline-none bg-[#1c160e] border border-amber-500/50 shadow-[0_0_24px_-2px_rgba(245,158,11,0.35)] active:scale-95";
        fabGlow.className = "absolute inset-0 rounded-full bg-amber-500/20 filter blur-md opacity-70";

      } else if (state === 'speaking') {
        // SPEAKING STATE
        statusTitle.textContent = "Val hablando";
        statusSubtitle.textContent = "“Para toxina botulínica en tercio superior disponemos de citas con la Dra. Méndez mañana a las 11:00.”";
        orbEqualizer.classList.remove('hidden');
        orbEqualizer.classList.add('flex');

        orbCore.className = "relative w-38 h-38 rounded-full flex items-center justify-center transition-all duration-700 shadow-2xl border-2 border-cyan-400/90 bg-gradient-to-b from-[#08202d] via-[#05141c] to-[#03090d] overflow-hidden";
        orbHalo.className = "absolute -inset-2 rounded-full filter blur-2xl transition-all duration-700 bg-cyan-400/35 opacity-80";
        orbLayerOuter.className = "absolute inset-3 rounded-full border border-cyan-400/50 animate-spin-slow transition-all duration-700";
        orbLayerMid.className = "absolute inset-6 rounded-full animate-spin-reverse opacity-80 filter blur-[1px] transition-all duration-700 bg-gradient-to-tr from-cyan-600/40 via-blue-500/30 to-teal-300/40";

        fabIcon.textContent = "volume_up";
        fabIcon.className = "material-symbols-outlined text-cyan-300 text-3xl z-10";
        mainFab.className = "relative group w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 focus:outline-none bg-[#091b24] border border-cyan-400/70 shadow-[0_0_28px_0px_rgba(6,182,212,0.4)] active:scale-95";
        fabGlow.className = "absolute inset-0 rounded-full bg-cyan-400/30 filter blur-md opacity-90";
      }
    }

    // Toggle FAB Click
    function toggleListeningFAB() {
      if (currentState === 'idle') {
        setVoiceState('listening');
      } else if (currentState === 'listening') {
        setVoiceState('thinking');
        setTimeout(() => {
          if (currentState === 'thinking') {
            setVoiceState('speaking');
          }
        }, 1800);
      } else {
        setVoiceState('idle');
      }
    }

    // Click on central orb cycles forward through states
    function cycleNextState() {
      const currentIndex = states.indexOf(currentState);
      const nextIndex = (currentIndex + 1) % states.length;
      setVoiceState(states[nextIndex]);
    }

    // Bottom Sheet collapse toggle
    function toggleBottomSheet() {
      const sheet = document.getElementById('chips-container');
      const icon = document.getElementById('collapse-icon');
      if (isSheetCollapsed) {
        sheet.classList.remove('hidden');
        icon.textContent = 'keyboard_arrow_down';
        isSheetCollapsed = false;
      } else {
        sheet.classList.add('hidden');
        icon.textContent = 'keyboard_arrow_up';
        isSheetCollapsed = true;
      }
    }

    // Chip selection interaction
    function handleChipSelect(promptText) {
      // Auto-collapse sheet slightly or show action
      statusTitle.textContent = promptText;
      statusSubtitle.textContent = `Procesando consulta médica sobre "${promptText}"...`;
      setVoiceState('thinking');
      setTimeout(() => {
        setVoiceState('speaking');
      }, 1500);
    }

    // Initialize Default State
    setVoiceState('idle');
  </script>
</body></html>

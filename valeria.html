<script>
/* ====== ADAPTER: Stitch UI + Voice Core Original ====== */
(function() {
  // Elementos del voice core original que el script espera encontrar por getElementById.
  // El voice core hace sus propios getElementById, asi que creamos elementos fantasma
  // y conectamos los reales del Stitch donde corresponde.
  function ghost(id, tag) {
    let el = document.getElementById(id);
    if (!el) { el = document.createElement(tag || 'div'); el.id = id; el.style.display = 'none'; document.body.appendChild(el); }
    return el;
  }
  // chat: el voice core le agrega mensajes — lo creamos oculto (Stitch usa status-title)
  // GHOSTS COMPLETOS: el voice core hace getElementById de 25 IDs al cargar.
  // Si alguno es null, el script muere en la primera linea y NADA funciona.
  // Creamos TODOS los que no existen en la UI Stitch.
  var NEED = ['chat','viz','chips','start','startBtn','status','orbWrap',
              'holoStart','holoDock','stars','backdrop',
              'fabAgenda','drAgenda','agendaBody','fabCart','drCart','cartBody','cartBadge',
              'fabLog','drLog','logBody','citaMsg','waNombre','waTel','textInput'];
  NEED.forEach(function(id){ ghost(id, id==='viz'?'canvas':(id==='textInput'?'input':'div')); });
  // Referencias reales de Stitch que el adapter usa mas abajo:
  var fab = document.getElementById('main-fab');
  var sb = document.getElementById('startBtn');
  var stitchChips = document.getElementById('chips-container');

  // Tras cargar el voice core, enganchar el FAB y chips reales de Stitch:
  window.addEventListener('load', function() {
    // FAB = orbWrap: click = barge-in / empezar a escuchar / iniciar sesion
    if (fab) {
      fab.addEventListener('click', function() {
        if (!window.session) { sb.click(); return; }
        if (window.recording) { window.stopRecording && window.stopRecording(); }
        else if (!window.busy && !window.micBlocked) { window.listen && window.listen(); }
      });
    }
    // Estado del voice core -> actualizar Stitch status-title/subtitle + orb
    const statusTitle = document.getElementById('status-title');
    const statusSubtitle = document.getElementById('status-subtitle');
    // El texto de estado lo gestiona SOLO val-ux-patch (un único dueño — sin loop de parpadeo)
    if (statusTitle) statusTitle.textContent = 'Val — Asistente de Voz de AplicatiBox';
    // Chips de Stitch -> prompts reales al cerebro
    const chipMap = {
      'Precio botox': 'Hola, ¿cuánto vale el botox de la frente?',
      'Agendar cita': 'Quiero agendar una cita',
      'Tratamientos': '¿Qué tratamientos tienen?',
      'Horarios': 'Horarios y disponibilidad',
    };
    document.querySelectorAll('#chips-container .chip, #chips-container button').forEach(function(el) {
      var txt = (el.textContent || '').trim();
      for (var k in chipMap) { if (txt.indexOf(k) >= 0) { el.dataset.prompt = chipMap[k]; break; } }
    });
    if (stitchChips) {
      stitchChips.addEventListener('click', function(e) {
        var chip = e.target.closest('[data-prompt]');
        if (chip) {
          if (!window.session) { sb.click(); setTimeout(function(){ window.ask && window.ask(chip.dataset.prompt); }, 500); }
          else { window.ask && window.ask(chip.dataset.prompt); }
          // Colapsar el sheet como pide el diseño
          var sheet = document.getElementById('bottom-sheet');
          if (sheet) sheet.classList.add('collapsed');
        }
      });
    }
    console.log('[Val Fusion] Stitch UI + voz real conectadas');
  });
})();
</script>

/* ================== VISUALIZADOR CIRCULAR DE VOZ ================== */
const vizCtx = vizCv.getContext('2d');
let vizLevels = new Array(64).fill(0);
let vizAnim = null, targetLevel = 0, curLevel = 0;

function vizLoop(){
  const w = vizCv.width = vizCv.clientWidth * (window.devicePixelRatio||1);
  const h = vizCv.height = vizCv.clientHeight * (window.devicePixelRatio||1);
  vizCtx.clearRect(0,0,w,h);
  const cx = w/2, cy = h/2;
  const baseR = Math.min(w,h) * 0.30;
  // nivel global suavizado
  curLevel += (targetLevel - curLevel) * 0.18;
  if(recording && analyser){
    const buf = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(buf);
    const now = buf.reduce((a,b)=>a+b,0)/buf.length;
    targetLevel = Math.min(1, now/38);
  } else { targetLevel *= 0.94; }
  for(let i=0;i<vizLevels.length;i++){
    const jitter = targetLevel>0.05 ? (Math.random()*0.5+0.5) : 0.06;
    vizLevels[i] += ((curLevel*jitter) - vizLevels[i]) * 0.25;
  }
  const mode = orbWrap.dataset.mode;
  const col = mode==='thinking' ? '56,189,248' : mode==='speaking' ? '212,175,55' : '52,211,153';
  // barras radiales
  for(let i=0;i<vizLevels.length;i++){
    const ang = (i/vizLevels.length)*Math.PI*2 - Math.PI/2;
    const len = baseR*0.14 + vizLevels[i]*baseR*0.55;
    const x0 = cx + Math.cos(ang)*baseR, y0 = cy + Math.sin(ang)*baseR;
    const x1 = cx + Math.cos(ang)*(baseR+len), y1 = cy + Math.sin(ang)*(baseR+len);
    vizCtx.strokeStyle = `rgba(${col},${0.25+vizLevels[i]*0.6})`;
    vizCtx.lineWidth = Math.max(1.5, (w/240));
    vizCtx.lineCap = 'round';
    vizCtx.beginPath(); vizCtx.moveTo(x0,y0); vizCtx.lineTo(x1,y1); vizCtx.stroke();
  }
  // anillo base
  vizCtx.strokeStyle = `rgba(${col},.22)`;
  vizCtx.lineWidth = 1;
  vizCtx.beginPath(); vizCtx.arc(cx,cy,baseR,0,Math.PI*2); vizCtx.stroke();
  vizAnim = requestAnimationFrame(vizLoop);
}
vizLoop();

const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const SLOTS = ['9:00','10:00','11:00','2:00','3:00','4:00','5:00'];
const BUSY = {'1':['10:00','3:00'], '3':['9:00']};
let selDia = null, selHora = null;
function nextDays(n){
  const out = [];

}

  }).join('');

async function confirmarCita(){
  if(selDia==null || !selHora){ return; }
  const nombre = (document.getElementById('waNombre')?.value || '').trim() || 'Visitante';
  const tel = (document.getElementById('waTel')?.value || '').replace(/\D/g,'');
  const msgEl = document.getElementById('citaMsg');
  if(tel.length < 8){ msgEl.textContent = '✍ Escribe tu celular con indicativo (ej: 573001234567)'; return; }
  msgEl.textContent = 'Agendando…';
  const d = nextDays(8)[selDia];
  const fecha = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  try{
    const r = await fetch('/api/bookings', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({fecha, hora: selHora, nombre, telefono: tel, servicios: resumenCarrito()})});
    const j = await r.json();
    if(j.ok){
      WA_SENT = !!j.whatsapp;
      msgEl.innerHTML = j.whatsapp
        ? '✅ <b>Cita confirmada.</b> Te llega el WhatsApp ahora mismo ☕'

}

function downloadICS(){
  if(selDia==null || !selHora) return;
  const d = nextDays(8)[selDia];
  const [h,m] = selHora.includes(':') ? selHora.split(':').map(Number) : [Number(selHora),0];
  const hh = h < 8 ? h + 12 : h;
  const pad = x => String(x).padStart(2,'0');
  const f = x => `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const ini = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, m||0);
  const fin = new Date(ini.getTime() + 45*60000);
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DermaLuxe//Vali//ES','BEGIN:VEVENT',
    'UID:' + Date.now() + '@dermaluxe', 'DTSTAMP:' + f(new Date()), 'DTSTART:' + f(ini), 'DTEND:' + f(fin),
    'SUMMARY:DermaLuxe — Cita de valoración', 'LOCATION:DermaLuxe El Poblado, Medellín',
    'DESCRIPTION:Cita agendada con Vali (IA). Llega 10 min antes.',
    'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:Tu cita en DermaLuxe es en 1 hora','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
  a.download = 'cita-dermaluxe.ics';
  a.click();
  logEvent('📥','Calendario','Archivo .ics descargado — recordatorio 1h antes');
}

    return {msg:`Llevas ${items}: ${det}. Total ${fmt(total)} pesos. ¿Confirmamos o agregas algo más?`};
  }
  if(name==='clear_cart'){
    CART = {}; updateBadge(); return {msg:'Listo, carrito vacío. Empezamos de cero — ¿qué te llama la atención?'};
  }

    logEvent('🧾','Factura generada','Resumen del carrito listo para pagar');
    return {msg:'Te preparé la factura con el resumen. ¿Confirmas el pago?'};

    PRODUCTS.forEach(p=>addCard(p));
    return {msg:'Estos son nuestros tratamientos. Toca cualquier tarjeta para agregarla, o pregúntame lo que quieras de cada una.'};
  }
  return null;
}

/* ================== VOZ: hablar ================== */
async function speak(text){
  if(!text) return;
  try{
    if(fillerAudio){ fillerAudio.pause(); fillerAudio=null; }
    if(responseAudio){ responseAudio.pause(); responseAudio=null; }
    const res = await fetch('/api/tts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
    if(!res.ok) throw 0;
    const blob = await res.blob();
    responseAudio = new Audio(URL.createObjectURL(blob));
    setMode('speaking');
    await responseAudio.play();
    return new Promise(resolve=>{
      responseAudio.onended = ()=>{ responseAudio=null; resolve(); };
      responseAudio.onerror = ()=>{ responseAudio=null; resolve(); };
    });
  }catch(e){
    try{
      const u = new SpeechSynthesisUtterance(text); u.lang='es-CO'; u.rate=1.04;
      speechSynthesis.speak(u);
      return new Promise(r=>{ u.onend=r; u.onerror=r; });
    }catch(_){ return; }
  }
}

/* fillers mientras consulta */
const FILLER_TXT = ['Un momentico, ya te cuento…','Déjame confirmar eso…','Al toque te respondo…'];
async function playFiller(){
  if(!speakOn || fillerAudio || !session) return;
  try{
    const res = await fetch('/api/tts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:FILLER_TXT[Math.floor(Math.random()*3)]})});
    if(!res.ok) return;
    fillerAudio = new Audio(URL.createObjectURL(await res.blob()));
    fillerAudio.volume = .85;
    fillerAudio.play();
  }catch(e){}
}
function stopFiller(){ if(fillerAudio){ try{fillerAudio.pause();}catch(_){} fillerAudio=null; } }

/* ================== VOZ: escuchar continuo auto-reparado ================== */
async function listen(){
  if(busy || recording || !session || micBlocked) return;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    listenFails = 0;
  }catch(e){
    listenFails++;
    if(listenFails === 1){
      addMsg('🎙 Activa el micrófono: candado 🔒 de la barra → Permisos → Micrófono → Permitir. Mientras tanto, escríbeme abajo — contesto igual.', 'bot');
      micBlocked = true;
      setMode('idle');
      textInput.focus();
    }
    return;
  }
  try{
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
  }catch(e){
    listenFails++;
    scheduleNextListen(1500); // reintento suave
    return;
  }
  mediaRecorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = ()=>{
    try{ stream.getTracks().forEach(t=>t.stop()); }catch(_){}
    if(audioCtx){ audioCtx.close().catch(()=>{}); audioCtx=null; }
    const blob = new Blob(chunks, {type: mediaRecorder.mimeType||'audio/webm'});
    if(blob.size < 1300){ setMode('idle'); scheduleNextListen(400); return; } // toque accidental
    try{ window.ValQuota && window.ValQuota.registrarVoz((Date.now()-startedAt)/1000); }catch(_){} // Val: banco de minutos (§6.1)
    transcribe(blob);
  };
  try{ mediaRecorder.start(); }
  catch(e){ scheduleNextListen(1200); return; }
  recording = true; startedAt = Date.now();
  setMode('listening');
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);
  const buf = new Uint8Array(analyser.frequencyBinCount);
  let spoke = false;
  silenceAt = 0;
  const vad = setInterval(()=>{
    if(!recording){ clearInterval(vad); return; }
    analyser.getByteFrequencyData(buf);
    const level = buf.reduce((a,b)=>a+b,0) / buf.length;
    const now = Date.now();
    if(level > 14) { spoke = true; silenceAt = 0; }
    else if(spoke && !silenceAt) silenceAt = now;
    const maxMs = 16000;
    if((spoke && silenceAt && now - silenceAt > 1300) || now - startedAt > maxMs){
      clearInterval(vad);
      stopRecording();
    }
  }, 120);
}
function stopRecording(){
  if(!recording) return;
  recording = false;
  try{ mediaRecorder.stop(); }catch(_){}
}
function scheduleNextListen(ms){
  setTimeout(()=>{ if(session && !busy && !micBlocked) listen(); }, ms||600);
}

/* ================== CEREBRO ================== */
async function ask(text){
  if(busy) return;
  busy = true;
  addMsg(text, 'user');
  setMode('thinking');
  playFiller();
  let say = null, j = null;
  try{
    const res = await fetch('/api/voice-assistant', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, history:window.__h||[]})});
    j = await res.json();
    window.__h = j.history || [];
    stopFiller();
    const r = j.action ? doAction(j.action, j.args||{}) : null;
    say = (r && r.msg) ? r.msg : (j.answer || '¿Me lo repites?');
  }catch(e){
    stopFiller();
    say = 'Uy, se me atravesó la conexión. ¿Me repites?';
  }
  addMsg(say, 'bot');
  await speak(say);
  busy = false;
  setMode('idle');
  scheduleNextListen(500); // conversación continua: vuelve a escuchar sola
}

async function transcribe(blob){
  setMode('thinking');
  playFiller();
  try{
    const b64 = await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
    const res = await fetch('/api/asr', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({audio:b64, mime:blob.type})});
    const j = await res.json();
    stopFiller();
    if(j.ok && j.text){ busy=false; ask(j.text); return; }
    setMode('idle');
    scheduleNextListen(300);
  }catch(e){
    stopFiller();
    setMode('idle');
    scheduleNextListen(600);
  }
}

/* ================== MODOS VISUALES ================== */
function setMode(m){
  orbWrap.className = 'orb-wrap ' + m;
  orbWrap.dataset.mode = m;
  if(m==='listening'){ statusEl.innerHTML='<span class="wave"><i></i><i></i><i></i><i></i><i></i></span> Te escucho… habla normal'; }
  else if(m==='thinking'){ statusEl.textContent='Consultando…'; }
  else if(m==='speaking'){ statusEl.textContent='Vali hablando…'; }
  else if(session){ statusEl.textContent='Te escucho cada vez que hables · o escríbeme'; }
  else { statusEl.textContent='Toca ✦ para activar tu micrófono'; }
}

/* teclado */
textInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && textInput.value.trim()){
    const v = textInput.value.trim(); textInput.value=''; ask(v);
  }
});

/* orb: interrupción manual (barge-in) — lo único tocable */
orbWrap.onclick = ()=>{
  if(recording){ stopRecording(); }          // la corto y envía ya
  else if(session && !busy && !micBlocked){ listen(); }
};

/* ================== INICIO ================== */
function quickAsk(q){
  if(!session){
    document.getElementById('startBtn').click();
    setTimeout(()=>ask(q), 400);
    return;
  }
  document.getElementById('chips').style.display = 'none';
  ask(q);
}

document.getElementById('startBtn').onclick = async ()=>{
  document.getElementById('start').classList.add('hide');
  session = true;
  try{ window.ValQuota && window.ValQuota.nuevaSesion(); }catch(_){} // Val: nueva conversación del banco (§6.1)
  addMsg('Vali · DermaLuxe — sesión iniciada', 'sys');
  updateBadge();
  const saludo = 'Hola! Soy Val, la asistente de voz de AplicatiBox. Esta es una demo de lo que Val puede hacer por tu negocio: te atiende por voz, te da precios y agenda citas. Prueba tocando el círculo y pregúntame algo.';
  setMode('thinking');
  fetch('/api/tts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:saludo})}).catch(()=>{});
  await speak(saludo);
  addMsg(saludo, 'bot');
  setMode('idle');
  listen(); // ya está escuchando — sin tocar nada más
};

/* watchdog de escucha: si quedó colgada la sesión, se recupera sola */
setInterval(()=>{
  if(!session || busy) return;
  if(!recording && !micBlocked){ scheduleNextListen(0); }
}, 12000);
